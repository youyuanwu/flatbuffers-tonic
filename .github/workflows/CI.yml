name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        os: [ windows-2025, ubuntu-latest ]
    steps:
    - uses: actions/checkout@v7

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.90.0
        components: rustfmt, clippy
    
    # - uses: taiki-e/install-action@protoc

    # install flatc
    - name: Install flatc windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = "$env:TEMP\flatc.zip"
        $dir = "$env:TEMP\flatc"
        Invoke-WebRequest -Uri "https://github.com/google/flatbuffers/releases/download/v25.2.10/Windows.flatc.binary.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        echo $dir >> $env:GITHUB_PATH
    
    - name: Install flatc ubuntu
      if: runner.os == 'Linux'
      run: |
        wget https://github.com/google/flatbuffers/releases/download/v25.2.10/Linux.flatc.binary.clang++-18.zip
        unzip Linux.flatc.binary.clang++-18.zip
        sudo mv flatc /usr/local/bin/
    
    - name: Check flatc version
      run: flatc --version

    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run cargo check
      run: cargo check

    - name: Run cargo fmt
      run: cargo fmt --all -- --check
    
    - name: Run cargo clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run cargo build
      run: cargo build --all-targets

    - name: Run cargo test
      run: cargo test --all -- --nocapture

    - name: Run llvm-cov
      run: cargo llvm-cov --codecov --output-path codecov.json --include-build-script --ignore-filename-regex "flatbuffers-tonic-tests.*"

    - name: Show cov summary
      run: cargo llvm-cov report --summary-only --include-build-script --ignore-filename-regex "flatbuffers-tonic-tests.*"

    - name: Skip Codecov upload without token
      if: ${{ env.CODECOV_TOKEN == '' }}
      run: echo "Skipping Codecov upload because CODECOV_TOKEN is not configured."

    - name: Upload Report to Codecov
      if: ${{ env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v7
      with:
        files: ./codecov.json
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }} # required